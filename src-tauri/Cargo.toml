[package]
name = "zetla"
version = "0.1.5"
description = "A Tauri App"
authors = ["Max"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zetla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# M0-4：文件打开/另存对话框（M0-6 选项目文件夹同用）
tauri-plugin-dialog = "2"
# M0-6：项目树扫描 scan_project
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
which = "7"
# M0-9：异步 spawn 编译子进程、逐行读 stdout/stderr、取消
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt", "fs"] }
notify = "8.2.0"
# M0-15b：下载 TeX Live 安装器（流式写盘 + 进度）；Windows 走系统 TLS / 系统代理
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
# M0-15b：解压 install-tl.zip（内含 TeX Live 专用 Perl）
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# M0-15a：读注册表里的用户/系统 PATH（检测合并用，只读不改）
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# M1-4：解压 .synctex.gz（纯 Rust 后端 miniz_oxide，无 C 依赖）
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# M1-13：更新检测 —— 安装包 sha256 校验（无代码签名下的完整性保障）
sha2 = "0.10"
hex = "0.4"
# M1-15a：最近项目时间戳（仅 clock，避免拉入旧 time/iana 依赖）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
