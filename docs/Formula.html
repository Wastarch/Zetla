<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公式编辑器 - 公式模板</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 MathLive -->
    <script defer src="https://cdn.jsdelivr.net/npm/mathlive"></script>
    <!-- 引入 Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- 引入 html2canvas 用于输出图片 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        bg: '#f3f4f6',
                    }
                }
            }
        }
    </script>

    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        math-field {
            width: 100%;
            min-height: 250px;
            font-size: 1.5rem;
            outline: none;
            --math-field-background: transparent;
            --selection-background-color: #bfdbfe;
            padding: 10px;
            transition: font-size 0.2s ease;
        }

        math-field::part(virtual-keyboard-toggle) {
            display: none;
        }

        .latex-watermark {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200"><text x="50%" y="50%" font-family="Times New Roman, serif" font-size="120" font-style="italic" fill="%23f1f5f9" text-anchor="middle" dominant-baseline="middle">LaTeX</text></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 50%;
        }

        /* 下拉菜单基础样式 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 50;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            min-width: 120px;
            margin-top: 4px;
            padding: 4px 0;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 6px 12px;
            font-size: 0.875rem;
            color: #374151;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-item:hover {
            background-color: #f3f4f6;
            color: #2563eb;
        }

        /* 悬浮面板样式 (统一使用 fixed，最高层级) */
        .symbol-panel {
            position: fixed;
            z-index: 9999;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 500px;
            max-height: 500px;
            overflow-y: auto;
            display: none;
            padding: 16px;
        }

        .symbol-panel.show {
            display: block;
        }

        /* 快捷工具格子 */
        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 4px;
            margin-bottom: 16px;
        }

        .sym-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            width: 32px;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            background: white;
            color: #374151;
            cursor: pointer;
            transition: all 0.1s;
            font-size: 1.1rem;
            font-family: 'Times New Roman', serif;
        }

        .sym-btn:hover {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #2563eb;
        }

        /* 公式模板大格子 */
        .template-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .template-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.25rem;
            color: #1e293b;
            min-height: 64px;
        }

        .template-btn:hover {
            background: #eff6ff;
            border-color: #bfdbfe;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
        }

        .sym-section-title {
            font-size: 0.75rem;
            color: #6b7280;
            margin-bottom: 8px;
            margin-top: 12px;
            border-bottom: 1px solid #f3f4f6;
            padding-bottom: 4px;
        }

        .sym-section-title:first-child {
            margin-top: 0;
        }

        #sourceTextarea {
            width: 100%;
            min-height: 250px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 1rem;
            padding: 12px;
            outline: none;
            resize: none;
            border: none;
            background: transparent;
            line-height: 1.6;
            color: #1e293b;
        }

        .tool-btn.active {
            background-color: #eff6ff;
            border-color: #bfdbfe;
        }

        .tool-btn.active span:first-child {
            color: #2563eb;
        }

        /* Tab 样式 */
        .tab-btn {
            position: relative;
            padding-bottom: 8px;
            border-bottom: 2px solid transparent;
            color: #4b5563;
        }

        .tab-btn.active {
            border-bottom-color: #2563eb;
            color: #2563eb;
            font-weight: 500;
        }
    </style>
</head>

<body class="bg-bg text-gray-800 p-4 md:p-8 font-sans antialiased">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- 输入区域卡片 -->
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm relative">
            <!-- 头部 -->
            <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
                <div class="flex items-center gap-2 font-medium">
                    <i class="ph ph-pencil-simple text-lg"></i>
                    <span>输入区域 Input</span>
                </div>
                <button class="text-gray-500 hover:text-gray-800 transition-colors flex items-center gap-1 text-sm"
                    onclick="alert('设置功能即将上线')">
                    <i class="ph ph-gear"></i> 设置
                </button>
            </div>

            <!-- 工具栏 Tab -->
            <div class="px-4 pt-3 border-b border-gray-100 flex gap-6 text-sm">
                <button id="tabTools" class="tab-btn active">快捷工具</button>
                <button id="tabTemplates" class="tab-btn">公式模板</button>
                <button class="tab-btn text-gray-400 cursor-not-allowed" title="暂未开放">图片识别</button>
                <button class="tab-btn text-gray-400 cursor-not-allowed" title="暂未开放">文档识别</button>
                <button class="tab-btn text-gray-400 cursor-not-allowed" title="暂未开放">收藏夹</button>
            </div>

            <!-- ====== 内容区 1：快捷工具 (默认显示) ====== -->
            <div id="contentTools"
                class="p-4 overflow-x-auto no-scrollbar flex gap-3 border-b border-gray-100 relative">
                <!-- 常用符号 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-common">
                    <span
                        class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">∬∝</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">常用符号 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 希腊字母 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-greek">
                    <span
                        class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">αβγδ</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">希腊字母 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 分数微分 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-fraction">
                    <span
                        class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors block transform scale-110">x/y</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">分数微分 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 根式角标 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-root">
                    <span
                        class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">√eˣ</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">根式角标 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 极限对数 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-limit">
                    <span
                        class="text-lg font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors flex flex-col items-center leading-none">
                        <span>lim</span><span class="text-[10px]">n→∞</span>
                    </span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">极限对数 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 三角函数 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-trig">
                    <span class="text-lg font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">sin
                        α</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">三角函数 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 积分运算 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-integral">
                    <span
                        class="text-lg font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors flex flex-col items-center leading-none relative">
                        <span class="absolute -top-1 right-1 text-[10px]">b</span>
                        <span>∫</span>
                        <span class="absolute -bottom-1 left-1 text-[10px]">a</span>
                    </span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">积分运算 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
            </div>

            <!-- ====== 内容区 2：公式模板 (默认隐藏) ====== -->
            <div id="contentTemplates"
                class="p-4 overflow-x-auto no-scrollbar hidden gap-3 border-b border-gray-100 relative">
                <!-- 代数 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-algebra">
                    <span
                        class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">√(a²+b²)</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">代数 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 几何 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-geometry">
                    <span
                        class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">ΔABC</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">几何 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 不等式 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-inequality">
                    <span class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">a
                        &gt; b</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">不等式 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 微积分 (即您截图中的面板) -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-calculus">
                    <span
                        class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">∂y/∂x</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">微积分 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 矩阵 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-matrix-tpl">
                    <span class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">[1 0;
                        0 1]</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">矩阵 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 三角 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-trig-tpl">
                    <span
                        class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">e^(iθ)</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">三角 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 统计 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-statistics">
                    <span class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">C(n,
                        r)</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">统计 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 数列 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-sequence">
                    <span
                        class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">a(n)=2ⁿ</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">数列 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 物理 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-physics">
                    <span
                        class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">E=mc²</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">物理 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
                <!-- 化学 -->
                <button
                    class="tool-btn flex flex-col items-center justify-center min-w-[80px] h-[80px] border border-gray-200 rounded hover:bg-gray-50 transition-colors group flex-shrink-0"
                    data-target="panel-chemistry">
                    <span
                        class="text-xl font-serif text-gray-700 mb-1 group-hover:text-primary transition-colors">H₂O</span>
                    <span class="text-[11px] text-gray-500 flex items-center gap-0.5">化学 <i
                            class="ph ph-caret-down text-[10px]"></i></span>
                </button>
            </div>

            <!-- 二级工具栏 -->
            <div class="px-4 py-2 flex flex-wrap items-center justify-between border-b border-gray-100 bg-white">
                <div class="flex flex-wrap gap-2 text-sm">
                    <!-- 颜色下拉 -->
                    <div class="relative" id="colorDropdown">
                        <button
                            class="flex items-center gap-1 px-2 py-1 border border-gray-200 rounded text-gray-600 hover:bg-gray-50">
                            <i class="ph ph-palette"></i> 颜色 <i class="ph ph-caret-down text-xs"></i>
                        </button>
                        <div class="dropdown-menu">
                            <div class="dropdown-item" data-cmd="\color{red}"><span
                                    class="w-3 h-3 rounded-full bg-red-500 inline-block"></span> 红色</div>
                            <div class="dropdown-item" data-cmd="\color{blue}"><span
                                    class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span> 蓝色</div>
                            <div class="dropdown-item" data-cmd="\color{green}"><span
                                    class="w-3 h-3 rounded-full bg-green-500 inline-block"></span> 绿色</div>
                        </div>
                    </div>

                    <!-- 字体下拉 -->
                    <div class="relative" id="fontDropdown">
                        <button
                            class="flex items-center gap-1 px-2 py-1 border border-gray-200 rounded text-gray-600 hover:bg-gray-50">
                            <span class="font-serif font-bold">A</span> 字体 <i class="ph ph-caret-down text-xs"></i>
                        </button>
                        <div class="dropdown-menu">
                            <div class="dropdown-item" data-cmd="\mathbb{#@}">黑板粗体 (R)</div>
                            <div class="dropdown-item" data-cmd="\mathbf{#@}">加粗 (B)</div>
                            <div class="dropdown-item" data-cmd="\mathit{#@}">斜体 (I)</div>
                        </div>
                    </div>

                    <button
                        class="flex items-center gap-1 px-2 py-1 border border-red-200 rounded text-red-500 hover:bg-red-50 transition-colors ml-2"
                        id="clearBtn">
                        <i class="ph ph-trash"></i> 清空
                    </button>
                </div>

                <div class="flex items-center gap-3 mt-2 md:mt-0">
                    <!-- 源码/可视化 切换 -->
                    <div class="flex border border-gray-200 rounded overflow-hidden text-sm">
                        <button id="modeSourceBtn"
                            class="px-3 py-1 bg-white text-gray-600 hover:bg-gray-50 transition-colors border-r border-gray-200">源码</button>
                        <button id="modeVisualBtn" class="px-3 py-1 bg-primary text-white">可视化</button>
                    </div>
                    <!-- 缩放 -->
                    <div class="flex items-center border border-gray-200 rounded text-sm">
                        <button id="zoomOutBtn"
                            class="px-2 py-1 text-gray-600 hover:bg-gray-50 border-r border-gray-200">-</button>
                        <span class="px-3 py-1 bg-white text-gray-700 w-10 text-center" id="zoomLevel">16</span>
                        <button id="zoomInBtn"
                            class="px-2 py-1 text-gray-600 hover:bg-gray-50 border-l border-gray-200">+</button>
                    </div>
                </div>
            </div>

            <!-- 编辑器区域 -->
            <div class="relative p-2">
                <math-field id="mathfield" virtual-keyboard-mode="manual"></math-field>
                <textarea id="sourceTextarea" class="hidden" placeholder="请输入 LaTeX 源码..."></textarea>
            </div>
        </div>

        <!-- 输出区域卡片 -->
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm">
            <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
                <div class="flex items-center gap-2 font-medium">
                    <i class="ph ph-download-simple text-lg"></i>
                    <span>输出区域 Output</span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="flex items-center border border-gray-200 rounded text-sm">
                        <button id="previewZoomOut"
                            class="px-2 py-1 text-gray-500 border-r border-gray-200 hover:bg-gray-50">-</button>
                        <span class="px-3 py-1 text-primary font-medium w-16 text-center"
                            id="previewZoomLevel">100%</span>
                        <button id="previewZoomIn"
                            class="px-2 py-1 text-gray-500 border-l border-gray-200 hover:bg-gray-50">+</button>
                    </div>
                </div>
            </div>

            <div class="p-4">
                <div
                    class="w-full min-h-[16rem] border border-gray-100 rounded flex items-center justify-center latex-watermark overflow-auto relative">
                    <div id="outputPreview" class="text-3xl p-4 transition-all duration-200"
                        style="font-size: 2rem; transform-origin: center center;"></div>
                </div>
            </div>

            <div class="px-4 pb-4 flex justify-end gap-3 text-sm">
                <button id="exportImgBtn"
                    class="px-3 py-1.5 bg-blue-50 text-primary rounded hover:bg-blue-100 transition-colors flex items-center gap-1">
                    输出图片 <i class="ph ph-caret-down text-xs"></i>
                </button>
                <button id="copyCodeBtn"
                    class="px-3 py-1.5 bg-blue-50 text-primary rounded hover:bg-blue-100 transition-colors flex items-center gap-1">
                    输出代码 <i class="ph ph-caret-down text-xs"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 将所有悬浮面板放在 body 直属节点，位置由 JS 计算，避免被父级 overflow 遮挡 -->
    <div id="panel-container">
        <!-- ====== 快捷工具面板 ====== -->
        <div id="panel-common" class="symbol-panel">
            <div class="sym-section-title">更多常用符号</div>
            <div class="symbol-grid">
                <button class="sym-btn" data-latex="\infty">∞</button>
                <button class="sym-btn" data-latex="\partial">∂</button>
                <button class="sym-btn" data-latex="\nabla">∇</button>
                <button class="sym-btn" data-latex="\forall">∀</button>
                <button class="sym-btn" data-latex="\exists">∃</button>
                <button class="sym-btn" data-latex="\emptyset">∅</button>
            </div>
        </div>

        <div id="panel-greek" class="symbol-panel">
            <div class="sym-section-title">小写字母</div>
            <div class="symbol-grid">
                <button class="sym-btn" data-latex="\alpha">α</button>
                <button class="sym-btn" data-latex="\beta">β</button>
                <button class="sym-btn" data-latex="\gamma">γ</button>
                <button class="sym-btn" data-latex="\delta">δ</button>
                <button class="sym-btn" data-latex="\theta">θ</button>
                <button class="sym-btn" data-latex="\pi">π</button>
            </div>
        </div>

        <div id="panel-fraction" class="symbol-panel w-[300px]">
            <div class="sym-section-title">分数 / 微分模板</div>
            <div class="flex flex-wrap gap-2">
                <button class="sym-btn w-auto px-3 text-sm font-sans" data-latex="\frac{#@}{#?}">标准分数</button>
                <button class="sym-btn w-auto px-3 text-sm font-sans"
                    data-latex="\frac{\partial #@}{\partial #?}">偏导</button>
            </div>
        </div>

        <div id="panel-root" class="symbol-panel w-[300px]">
            <div class="sym-section-title">根式 / 上下标模板</div>
            <div class="flex flex-wrap gap-2">
                <button class="sym-btn w-auto px-3 text-sm font-sans" data-latex="\sqrt{#@}">平方根</button>
                <button class="sym-btn w-auto px-3 text-sm font-sans" data-latex="#@^{#?}">上标</button>
            </div>
        </div>

        <div id="panel-limit" class="symbol-panel w-[300px]">
            <div class="sym-section-title">极限 / 对数模板</div>
            <div class="flex flex-wrap gap-2 mb-3">
                <button class="sym-btn w-auto px-3 text-sm font-sans" data-latex="\lim_{#?} #@">极限</button>
                <button class="sym-btn w-auto px-3 text-sm font-sans" data-latex="\log_{#?} #@">对数</button>
            </div>
        </div>

        <div id="panel-trig" class="symbol-panel w-[300px]">
            <div class="sym-section-title">三角函数模板</div>
            <div class="flex flex-wrap gap-2">
                <button class="sym-btn w-auto px-3 text-sm font-sans" data-latex="\sin(#@)">sin</button>
                <button class="sym-btn w-auto px-3 text-sm font-sans" data-latex="\cos(#@)">cos</button>
            </div>
        </div>

        <div id="panel-integral" class="symbol-panel w-[300px]">
            <div class="sym-section-title">积分模板</div>
            <div class="flex flex-wrap gap-2">
                <button class="sym-btn w-auto px-3 text-sm font-sans" data-latex="\int_{#?}^{#?} #@ dx">定积分</button>
                <button class="sym-btn w-auto px-3 text-sm font-sans" data-latex="\int #@ dx">不定积分</button>
            </div>
        </div>

        <!-- ====== 公式模板面板 (参考截图排版) ====== -->

        <!-- 微积分 (超大网格) -->
        <div id="panel-calculus" class="symbol-panel w-[650px]">
            <div class="template-grid">
                <button class="template-btn" data-latex="\frac{d}{dx}e^x = e^x">\(\frac{d}{dx}e^x = e^x\)</button>
                <button class="template-btn" data-latex="\frac{d}{dx}e^{ax} = ae^{ax}">\(\frac{d}{dx}e^{ax} =
                    ae^{ax}\)</button>
                <button class="template-btn" data-latex="\frac{d}{dx}\ln(x) = \frac{1}{x}">\(\frac{d}{dx}\ln(x) =
                    \frac{1}{x}\)</button>
                <button class="template-btn" data-latex="\frac{d}{dx}\sin x = \cos x">\(\frac{d}{dx}\sin x = \cos
                    x\)</button>
                <button class="template-btn" data-latex="\int kdx = kx + C">\(\int kdx = kx + C\)</button>
                <button class="template-btn" data-latex="\int \frac{1}{x}dx = \ln|x| + C">\(\int \frac{1}{x}dx = \ln|x|
                    + C\)</button>
                <button class="template-btn" data-latex="\int \frac{1}{\sqrt{1-x^2}}dx = \arcsin x + C">\(\int
                    \frac{1}{\sqrt{1-x^2}}dx = \arcsin x + C\)</button>
                <button class="template-btn" data-latex="\int u \frac{dv}{dx}dx = uv - \int v \frac{du}{dx}dx">\(\int u
                    \frac{dv}{dx}dx = uv - \int v \frac{du}{dx}dx\)</button>
                <button class="template-btn" data-latex="\int_{-\infty}^{\infty} f(x) dx">\(\int_{-\infty}^{\infty} f(x)
                    dx\)</button>
                <button class="template-btn"
                    data-latex="\int x^\mu dx = \frac{x^{\mu+1}}{\mu+1} + C, (\mu \neq -1)">\(\int x^\mu dx =
                    \frac{x^{\mu+1}}{\mu+1} + C\)</button>
            </div>
        </div>

        <!-- 代数 -->
        <div id="panel-algebra" class="symbol-panel w-[500px]">
            <div class="template-grid">
                <button class="template-btn" data-latex="\sqrt{a^2+b^2}">\(\sqrt{a^2+b^2}\)</button>
                <button class="template-btn" data-latex="(a+b)^2 = a^2 + 2ab + b^2">\((a+b)^2\)</button>
                <button class="template-btn" data-latex="x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}">\(x = \frac{-b \pm
                    \sqrt{b^2-4ac}}{2a}\)</button>
                <button class="template-btn" data-latex="e^{i\pi} + 1 = 0">\(e^{i\pi} + 1 = 0\)</button>
            </div>
        </div>

        <!-- 几何 -->
        <div id="panel-geometry" class="symbol-panel w-[500px]">
            <div class="template-grid">
                <button class="template-btn" data-latex="\triangle ABC">\(\triangle ABC\)</button>
                <button class="template-btn" data-latex="\angle ABC = 90^\circ">\(\angle ABC = 90^\circ\)</button>
                <button class="template-btn" data-latex="AB \parallel CD">\(AB \parallel CD\)</button>
                <button class="template-btn" data-latex="AB \perp CD">\(AB \perp CD\)</button>
            </div>
        </div>

        <!-- 不等式 -->
        <div id="panel-inequality" class="symbol-panel w-[500px]">
            <div class="template-grid">
                <button class="template-btn" data-latex="a > b">\(a > b\)</button>
                <button class="template-btn" data-latex="a < b">\(a < b\)</button>
                        <button class="template-btn" data-latex="a \geq b">\(a \geq b\)</button>
                        <button class="template-btn" data-latex="a \leq b">\(a \leq b\)</button>
            </div>
        </div>

        <!-- 矩阵 -->
        <div id="panel-matrix-tpl" class="symbol-panel w-[500px]">
            <div class="template-grid">
                <button class="template-btn" data-latex="\begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}">\(\begin{pmatrix}
                    1 & 0 \\ 0 & 1 \end{pmatrix}\)</button>
                <button class="template-btn" data-latex="\begin{bmatrix} a & b \\ c & d \end{bmatrix}">\(\begin{bmatrix}
                    a & b \\ c & d \end{bmatrix}\)</button>
            </div>
        </div>

        <!-- 三角 -->
        <div id="panel-trig-tpl" class="symbol-panel w-[500px]">
            <div class="template-grid">
                <button class="template-btn"
                    data-latex="e^{i\theta} = \cos\theta + i\sin\theta">\(e^{i\theta}\)</button>
                <button class="template-btn" data-latex="\sin^2\theta + \cos^2\theta = 1">\(\sin^2\theta + \cos^2\theta
                    = 1\)</button>
            </div>
        </div>

        <!-- 统计 -->
        <div id="panel-statistics" class="symbol-panel w-[500px]">
            <div class="template-grid">
                <button class="template-btn" data-latex="C_n^r = \frac{n!}{r!(n-r)!}">\(C_n^r\)</button>
                <button class="template-btn" data-latex="A_n^r = \frac{n!}{(n-r)!}">\(A_n^r\)</button>
            </div>
        </div>

        <!-- 数列 -->
        <div id="panel-sequence" class="symbol-panel w-[500px]">
            <div class="template-grid">
                <button class="template-btn" data-latex="a_n = 2^n">\(a_n = 2^n\)</button>
                <button class="template-btn" data-latex="S_n = \frac{a_1(1-q^n)}{1-q}">\(S_n\) 等比数列</button>
            </div>
        </div>

        <!-- 物理 -->
        <div id="panel-physics" class="symbol-panel w-[500px]">
            <div class="template-grid">
                <button class="template-btn" data-latex="E = mc^2">\(E = mc^2\)</button>
                <button class="template-btn" data-latex="F = G\frac{m_1 m_2}{r^2}">\(F = G\frac{m_1 m_2}{r^2}\)</button>
            </div>
        </div>

        <!-- 化学 -->
        <div id="panel-chemistry" class="symbol-panel w-[500px]">
            <div class="template-grid">
                <button class="template-btn" data-latex="H_2O">\(H_2O\)</button>
                <button class="template-btn" data-latex="CO_2">\(CO_2\)</button>
                <button class="template-btn" data-latex="2H_2 + O_2 \rightarrow 2H_2O">\(2H_2 + O_2 \rightarrow
                    2H_2O\)</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mathField = document.getElementById('mathfield');
            const sourceTextarea = document.getElementById('sourceTextarea');
            const outputPreview = document.getElementById('outputPreview');
            const clearBtn = document.getElementById('clearBtn');
            const copyCodeBtn = document.getElementById('copyCodeBtn');
            const exportImgBtn = document.getElementById('exportImgBtn');
            const modeVisualBtn = document.getElementById('modeVisualBtn');
            const modeSourceBtn = document.getElementById('modeSourceBtn');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const zoomLevelDisplay = document.getElementById('zoomLevel');
            const previewZoomIn = document.getElementById('previewZoomIn');
            const previewZoomOut = document.getElementById('previewZoomOut');
            const previewZoomLevelDisplay = document.getElementById('previewZoomLevel');

            // 状态变量
            let currentZoom = 16;
            let currentPreviewZoom = 200;
            let isSourceMode = false;
            let activeTargetId = null;

            // 等待 MathLive 加载
            const initMathLive = setInterval(() => {
                if (window.MathLive && mathField && typeof mathField.executeCommand === 'function') {
                    clearInterval(initMathLive);
                    setupApp();
                }
            }, 100);

            function setupApp() {
                const defaultLatex = '\\int_{a}^{b} x^2 dx = \\frac{b^3 - a^3}{3}';
                mathField.value = defaultLatex;
                updateOutput();

                function updateOutput() {
                    const latex = isSourceMode ? sourceTextarea.value : mathField.value;
                    if (!latex.trim()) {
                        outputPreview.innerHTML = '<span class="text-gray-300 font-sans text-base">等待输入公式...</span>';
                        return;
                    }
                    if (window.MathLive && typeof MathLive.convertLatexToMarkup === 'function') {
                        outputPreview.innerHTML = MathLive.convertLatexToMarkup(latex, { mathstyle: 'displaystyle' });
                    }
                }

                mathField.addEventListener('input', () => { if (!isSourceMode) updateOutput(); });
                sourceTextarea.addEventListener('input', () => { if (isSourceMode) updateOutput(); });

                // ================= 1. Tab 切换逻辑 =================
                const tabTools = document.getElementById('tabTools');
                const tabTemplates = document.getElementById('tabTemplates');
                const contentTools = document.getElementById('contentTools');
                const contentTemplates = document.getElementById('contentTemplates');

                function switchTab(activeTab, activeContent, inactiveTab, inactiveContent) {
                    closeAllPanels();
                    activeTab.classList.add('active');
                    inactiveTab.classList.remove('active');
                    activeContent.classList.remove('hidden');
                    activeContent.classList.add('flex');
                    inactiveContent.classList.add('hidden');
                    inactiveContent.classList.remove('flex');
                }

                tabTools.addEventListener('click', () => switchTab(tabTools, contentTools, tabTemplates, contentTemplates));
                tabTemplates.addEventListener('click', () => switchTab(tabTemplates, contentTemplates, tabTools, contentTools));

                // ================= 2. 悬浮面板交互 =================
                const toolBtns = document.querySelectorAll('.tool-btn');

                function closeAllPanels() {
                    document.querySelectorAll('.symbol-panel').forEach(p => p.classList.remove('show'));
                    toolBtns.forEach(b => b.classList.remove('active'));
                    activeTargetId = null;
                }

                toolBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const targetId = btn.getAttribute('data-target');
                        const panel = document.getElementById(targetId);
                        if (!panel) return;

                        if (activeTargetId === targetId) {
                            closeAllPanels();
                            return;
                        }

                        closeAllPanels();

                        const rect = btn.getBoundingClientRect();
                        panel.style.left = `${rect.left}px`;
                        panel.style.top = `${rect.bottom + 8}px`;

                        panel.classList.add('show');
                        btn.classList.add('active');
                        activeTargetId = targetId;
                    });
                });

                document.addEventListener('click', (e) => {
                    if (activeTargetId && !e.target.closest('.symbol-panel')) {
                        closeAllPanels();
                    }
                });

                // ================= 3. 内容插入逻辑 =================
                function insertLatex(latexCmd) {
                    if (!latexCmd) return;
                    if (isSourceMode) {
                        const start = sourceTextarea.selectionStart;
                        const end = sourceTextarea.selectionEnd;
                        const text = sourceTextarea.value;
                        sourceTextarea.value = text.substring(0, start) + latexCmd + text.substring(end);
                        sourceTextarea.focus();
                        sourceTextarea.selectionStart = sourceTextarea.selectionEnd = start + latexCmd.length;
                        updateOutput();
                    } else {
                        mathField.focus();
                        mathField.executeCommand(['insert', latexCmd]);
                        updateOutput();
                    }
                }

                // 绑定所有小符号按钮
                document.querySelectorAll('.sym-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        insertLatex(btn.getAttribute('data-latex'));
                    });
                });

                // 绑定所有公式模板大按钮
                document.querySelectorAll('.template-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const latex = btn.getAttribute('data-latex');
                        if (latex) {
                            // 插入公式模板，并清空或定位光标
                            insertLatex(latex);
                            // 可选：点击模板后自动收起面板
                            // closeAllPanels(); 
                        }
                    });
                });

                // ================= 4. 二级工具栏下拉 =================
                function setupDropdown(dropdownId) {
                    const container = document.getElementById(dropdownId);
                    if (!container) return;
                    const btn = container.querySelector('button');
                    const menu = container.querySelector('.dropdown-menu');

                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        document.querySelectorAll('.dropdown-menu').forEach(m => {
                            if (m !== menu) m.classList.remove('show');
                        });
                        menu.classList.toggle('show');
                    });

                    menu.querySelectorAll('.dropdown-item').forEach(item => {
                        item.addEventListener('click', () => {
                            insertLatex(item.getAttribute('data-cmd'));
                            menu.classList.remove('show');
                        });
                    });
                }

                setupDropdown('colorDropdown');
                setupDropdown('fontDropdown');

                document.addEventListener('click', () => {
                    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
                });

                // ================= 5. 其他基础功能 =================
                clearBtn.addEventListener('click', () => {
                    if (isSourceMode) sourceTextarea.value = '';
                    else mathField.value = '';
                    updateOutput();
                    (isSourceMode ? sourceTextarea : mathField).focus();
                });

                modeSourceBtn.addEventListener('click', () => {
                    if (isSourceMode) return;
                    isSourceMode = true;
                    sourceTextarea.value = mathField.value;
                    mathField.classList.add('hidden');
                    sourceTextarea.classList.remove('hidden');
                    modeSourceBtn.className = 'px-3 py-1 bg-primary text-white border-r border-gray-200';
                    modeVisualBtn.className = 'px-3 py-1 bg-white text-gray-600 hover:bg-gray-50 transition-colors';
                    sourceTextarea.focus();
                });

                modeVisualBtn.addEventListener('click', () => {
                    if (!isSourceMode) return;
                    isSourceMode = false;
                    mathField.value = sourceTextarea.value;
                    sourceTextarea.classList.add('hidden');
                    mathField.classList.remove('hidden');
                    modeVisualBtn.className = 'px-3 py-1 bg-primary text-white';
                    modeSourceBtn.className = 'px-3 py-1 bg-white text-gray-600 hover:bg-gray-50 transition-colors border-r border-gray-200';
                    mathField.focus();
                    updateOutput();
                });

                function updateEditorZoom() {
                    mathField.style.fontSize = `${currentZoom / 10}rem`;
                    sourceTextarea.style.fontSize = `${currentZoom / 16}rem`;
                    zoomLevelDisplay.textContent = currentZoom;
                }
                zoomInBtn.addEventListener('click', () => { if (currentZoom < 36) { currentZoom += 2; updateEditorZoom(); } });
                zoomOutBtn.addEventListener('click', () => { if (currentZoom > 10) { currentZoom -= 2; updateEditorZoom(); } });

                function updatePreviewZoom() {
                    outputPreview.style.fontSize = `${currentPreviewZoom}%`;
                    previewZoomLevelDisplay.textContent = `${currentPreviewZoom}%`;
                }
                previewZoomIn.addEventListener('click', () => { if (currentPreviewZoom < 400) { currentPreviewZoom += 20; updatePreviewZoom(); } });
                previewZoomOut.addEventListener('click', () => { if (currentPreviewZoom > 40) { currentPreviewZoom -= 20; updatePreviewZoom(); } });

                copyCodeBtn.addEventListener('click', async () => {
                    const latexStr = isSourceMode ? sourceTextarea.value : mathField.value;
                    if (!latexStr) return;
                    try {
                        await navigator.clipboard.writeText(latexStr);
                        const originalHtml = copyCodeBtn.innerHTML;
                        copyCodeBtn.innerHTML = '<i class="ph ph-check"></i> 已复制';
                        copyCodeBtn.classList.replace('bg-blue-50', 'bg-green-50');
                        copyCodeBtn.classList.replace('text-primary', 'text-green-600');
                        setTimeout(() => {
                            copyCodeBtn.innerHTML = originalHtml;
                            copyCodeBtn.classList.replace('bg-green-50', 'bg-blue-50');
                            copyCodeBtn.classList.replace('text-green-600', 'text-primary');
                        }, 2000);
                    } catch (err) { alert('复制失败'); }
                });

                exportImgBtn.addEventListener('click', () => {
                    const latex = isSourceMode ? sourceTextarea.value : mathField.value;
                    if (!latex.trim()) return alert('请先输入公式');

                    const originalHtml = exportImgBtn.innerHTML;
                    exportImgBtn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> 生成中...';

                    const tempContainer = document.createElement('div');
                    tempContainer.style.padding = '40px';
                    tempContainer.style.background = 'white';
                    tempContainer.style.display = 'inline-block';
                    tempContainer.innerHTML = MathLive.convertLatexToMarkup(latex, { mathstyle: 'displaystyle' });
                    tempContainer.style.fontSize = '3rem';
                    document.body.appendChild(tempContainer);

                    html2canvas(tempContainer, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
                        document.body.removeChild(tempContainer);
                        const link = document.createElement('a');
                        link.download = 'formula.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        exportImgBtn.innerHTML = originalHtml;
                    }).catch(err => {
                        document.body.removeChild(tempContainer);
                        alert('生成失败');
                        exportImgBtn.innerHTML = originalHtml;
                    });
                });

                updateEditorZoom();
                updatePreviewZoom();

                window.addEventListener('resize', closeAllPanels);
                contentTools.addEventListener('scroll', closeAllPanels);
                contentTemplates.addEventListener('scroll', closeAllPanels);
            }
        });
    </script>
</body>

</html>
