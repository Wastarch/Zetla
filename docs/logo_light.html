<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z · 文档编辑器徽章 · Times New Roman</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f7fc;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        .badge-container {
            filter: drop-shadow(0 10px 18px rgba(0, 20, 50, 0.12));
            transition: filter 0.25s ease;
        }

        .badge-container:hover {
            filter: drop-shadow(0 16px 24px rgba(0, 20, 50, 0.18));
        }

        svg {
            display: block;
            width: 280px;
            height: 280px;
        }

        svg .code-brace {
            transition: transform 0.2s ease;
        }

        svg:hover .code-brace {
            transform: scale(1.03);
        }
    </style>
</head>

<body>
    <div class="badge-container">
        <svg viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- 圆角方形徽章背景 -->
            <rect x="20" y="20" width="240" height="240" rx="48" fill="url(#badgeGradientLight)" />

            <!-- 内圈边框 -->
            <rect x="22" y="22" width="236" height="236" rx="46" stroke="#D0D8EC" stroke-width="1.5" fill="none"
                opacity="0.9" />

            <!-- 渐变色定义 -->
            <defs>
                <linearGradient id="badgeGradientLight" x1="20" y1="20" x2="260" y2="260"
                    gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#FFFFFF" />
                    <stop offset="100%" stop-color="#EAEFF9" />
                </linearGradient>
                <linearGradient id="zGradientLight" x1="90" y1="70" x2="195" y2="210" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#1E2A3A" />
                    <stop offset="100%" stop-color="#3C4A62" />
                </linearGradient>
                <linearGradient id="pageFoldGradientLight" x1="95" y1="175" x2="130" y2="210"
                    gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#E6ECF8" />
                    <stop offset="100%" stop-color="#BCC8E0" />
                </linearGradient>
                <linearGradient id="braceGradientLight" x1="165" y1="115" x2="205" y2="170"
                    gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#3A7BFF" />
                    <stop offset="100%" stop-color="#1E4FBB" />
                </linearGradient>
                <linearGradient id="lineGradientLight" x1="90" y1="145" x2="190" y2="145"
                    gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#3A7BFF" stop-opacity="0.1" />
                    <stop offset="30%" stop-color="#3A7BFF" stop-opacity="0.85" />
                    <stop offset="70%" stop-color="#3A7BFF" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="#3A7BFF" stop-opacity="0.1" />
                </linearGradient>
            </defs>

            <!-- ========== 使用 Times New Roman 字体的字母 Z ========== -->
            <text x="140" y="195" font-family="'Times New Roman', Times, serif" font-size="140" font-weight="900"
                fill="url(#zGradientLight)" text-anchor="middle" dominant-baseline="auto" letter-spacing="0"
                style="font-weight: 900; font-stretch: condensed;">Z</text>

            <!-- ========== 折角/页边距结构 ========== -->
            <g>
                <path d="M90 202 L90 175 L118 202 L90 202 Z" fill="url(#pageFoldGradientLight)" />
                <path d="M90 175 L90 202 L118 202" stroke="#8C9CC0" stroke-width="1.5" fill="none" opacity="0.8" />
                <path d="M90 180 L90 202 L110 202 L90 180 Z" fill="#FFFFFF" opacity="0.4" />
                <rect x="90" y="195" width="28" height="8" fill="#BCC8E0" opacity="0.5" rx="1" />
            </g>

            <!-- ========== 缩小后的代码括号 { } 位于Z右侧 ========== -->
            <g class="code-brace">
                <!-- 左花括号 - 尺寸缩小，位置紧凑 -->
                <path
                    d="M168 122 C168 122, 160 122, 160 130 L160 141 C160 149, 153 149, 153 149 C153 149, 160 149, 160 157 L160 168 C160 176, 168 176, 168 176"
                    stroke="url(#braceGradientLight)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
                    fill="none" />
                <!-- 右花括号 - 尺寸缩小 -->
                <path
                    d="M192 122 C192 122, 200 122, 200 130 L200 141 C200 149, 207 149, 207 149 C207 149, 200 149, 200 157 L200 168 C200 176, 192 176, 192 176"
                    stroke="url(#braceGradientLight)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
                    fill="none" />
            </g>

            <!-- ========== 细蓝色横线 ========== -->
            <rect x="88" y="144" width="104" height="2.5" rx="1.25" fill="url(#lineGradientLight)" />

            <!-- 页边距氛围虚线 -->
            <line x1="80" y1="92" x2="80" y2="198" stroke="#9AABD0" stroke-width="0.8" stroke-dasharray="2 4"
                opacity="0.5" />
            <line x1="200" y1="92" x2="200" y2="198" stroke="#9AABD0" stroke-width="0.8" stroke-dasharray="2 4"
                opacity="0.5" />

            <!-- 细微高光内发光 -->
            <rect x="22" y="22" width="236" height="236" rx="46" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"
                fill="none" />
        </svg>
    </div>
</body>

</html>
