name: Build Linux

# 手动触发：在仓库 Actions 页 → Build Linux → Run workflow，可选打包格式。
on:
  workflow_dispatch:
    inputs:
      bundles:
        description: "Linux 安装包格式（空格分隔；deb / appimage / rpm）"
        required: true
        default: "deb appimage"
        type: choice
        options:
          - "deb appimage"
          - "deb"
          - "appimage"
          - "deb appimage rpm"

jobs:
  build-linux:
    name: Build Linux (${{ github.event.inputs.bundles }})
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies (Tauri 2 prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # 在 Linux 上 src-tauri/tauri.linux.conf.json 会自动合并，
      # 把 bundle.active 翻成 true；--bundles 再显式指定格式。
      - name: Build Tauri Linux bundles
        run: npm run tauri build -- --ci --bundles ${{ github.event.inputs.bundles }}

      # 校验和随产物一起上传：发版时 scripts/update-manifest.mjs 生成的 sha256
      # 必须与这里一致（人工核对用，脚本本身会重算）。
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle
          : > SHA256SUMS
          for f in appimage/*.AppImage deb/*.deb rpm/*.rpm; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zetla-linux-${{ github.event.inputs.bundles }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/SHA256SUMS
          if-no-files-found: warn
